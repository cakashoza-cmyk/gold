name: refresh-data
on:
  schedule:
    - cron: "0 3,9,15 * * *"   # 08:30, 14:30, 20:30 IST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet numpy
      - name: Fetch public data
        run: python3 scripts/fetch.py
      - name: Log, score and re-fit model
        run: python3 scripts/model.py
      - name: Unit tests
        run: python3 -m unittest discover -s test -p "test_*.py"
      - name: Commit data
        run: |
          git config user.name "golddesk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
